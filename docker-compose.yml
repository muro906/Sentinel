networks:
    sentinel-net:
        driver: bridge

volumes:
    zeek-logs:
    pgdata:
    redisdata:
    ollama-models:


services:
    # ─── Zookeeper ────────────────────────────────────────────────────────────────
    zookeeper:
        image: confluentinc/cp-zookeeper:7.6.0
        container_name: sentinel-zookeeper
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        networks:
            - sentinel-net
        healthcheck:
            test: [ "CMD", "bash", "-c", "echo ruok | nc localhost 2181" ]
            interval: 10s
            timeout: 5s
            retries: 5

    # ─── Kafka ────────────────────────────────────────────────────────────────────
    kafka:
        image: confluentinc/cp-kafka:7.6.0
        container_name: sentinel-kafka
        depends_on:
            zookeeper:
                condition: service_healthy
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
            KAFKA_LOG_RETENTION_HOURS: 2
        networks:
            - sentinel-net
        healthcheck:
            test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
            interval: 15s
            timeout: 10s
            retries: 8
            start_period: 25s

    # ─── Kafka UI ─────────────────────────────────────────────────────────────────
    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: sentinel-kafka-ui
        depends_on:
            kafka:
                condition: service_healthy
        environment:
            KAFKA_CLUSTERS_0_NAME: sentinel
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
        ports:
            - "9000:8080"
        networks:
            - sentinel-net

    # ─── Zeek ─────────────────────────────────────────────────────────────────────
    zeek:
        build:
            context: ./ingestion/zeek
            dockerfile: Dockerfile
        container_name: sentinel-zeek
        volumes:
            - ./capture/pcap:/pcap:ro
            - zeek-logs:/zeek-logs
        networks:
            - sentinel-net

    # ─── Feature Extractor ────────────────────────────────────────────────────────
    feature-extractor:
        build:
            context: ./ingestion
            dockerfile: Dockerfile
        container_name: sentinel-feature-extractor
        depends_on:
            kafka:
                condition: service_healthy
        environment:
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            KAFKA_TOPIC: network-features
            ZEEK_LOG_DIR: /zeek-logs
            LOG_LEVEL: INFO
        volumes:
            - zeek-logs:/zeek-logs:ro
        networks:
            - sentinel-net

    # ─── PostgreSQL (CVE + Asset DB) ────────────────────────────────────────────
    postgres:
        image: pgvector/pgvector:pg16
        container_name: sentinel-postgres
        environment:
            POSTGRES_DB: sentinel
            POSTGRES_USER: sentinel
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev}
        volumes:
            - pgdata:/var/lib/postgresql/data
            - ./database/migrations:/docker-entrypoint-initdb.d
        ports:
            - "5432:5432"
        networks:
            - sentinel-net
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U sentinel" ]
            interval: 10s
            timeout: 5s
            retries: 5

    # ─── Redis (Agent State + Task Queues) ──────────────────────────────────────
    redis:
        image: redis:7-alpine
        container_name: sentinel-redis
        command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
        volumes:
            - redisdata:/data
        ports:
            - "6379:6379"
        networks:
            - sentinel-net
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5

    # ─── Ollama (Local LLM Serving) ─────────────────────────────────────────────
    ollama:
        image: ollama/ollama:latest
        container_name: sentinel-ollama
        volumes:
            - ollama-models:/root/.ollama
        ports:
            - "11434:11434"
        networks:
            - sentinel-net
        healthcheck:
            test: [ "CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1" ]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 10s

    # ─── Orchestrator Agent (Layer 3) ───────────────────────────────────────────
    orchestrator:
        build:
            context: ./agentic
            dockerfile: Dockerfile
        container_name: sentinel-orchestrator
        depends_on:
            kafka:
                condition: service_healthy
            redis:
                condition: service_healthy
            postgres:
                condition: service_healthy
            ollama:
                condition: service_healthy
        environment:
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            REDIS_URL: redis://redis:6379
            DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD:-sentinel_dev}@postgres:5432/sentinel
            LLM_BASE_URL: http://ollama:11434
            LLM_MODEL: mistral:7b-instruct-v0.3-q4_K_M
            LOG_LEVEL: INFO
        networks:
            - sentinel-net

    # ─── ET-SSL Detection Service (Layer 2) ──────────────────────────────────
    # Consumes: network-features   (from ingestion/feature-extractor)
    # Produces: anomaly-alerts     (consumed by orchestrator)
    #
    # Before starting: place trained model artifacts in ./detection-service/models/
    #   encoder_weights.pt  scaler.joblib  centroid.npy  model_meta.json
    detection-service:
        build:
            context: ./detection-service
            dockerfile: Dockerfile
        container_name: sentinel-detection-service
        depends_on:
            kafka:
                condition: service_healthy
            feature-extractor:
                condition: service_started
        environment:
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            INPUT_TOPIC:    network-features
            OUTPUT_TOPIC:   anomaly-alerts
            MODEL_DIR:      /models
            LOG_LEVEL:      INFO
            # Optional: override calibrated threshold from Colab
            # ANOMALY_THRESHOLD: "0.85"
            # How many consecutive normal flows before EMA centroid update
            EMA_UPDATE_EVERY: "1000"
        volumes:
            - ./detection-service/models:/models:ro
        networks:
            - sentinel-net
        restart: unless-stopped
gateway:
    image: nginx:1.25-alpine
    container_name: sentinel-gateway
    ports: ["80:80","443:443"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/certs:/etc/nginx/certs:ro
      - ./dashboard/frontend/dist:/usr/share/nginx/html:ro
    depends_on: [dashboard-backend]
    networks: [sentinel-net]

dashboard-backend:
    build:
      context: ./dashboard/backend
      dockerfile: Dockerfile
    container_name: sentinel-dashboard-backend
    expose: ["8000"]
    depends_on:
      kafka:    {condition: service_healthy}
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
    environment:
      DATABASE_URL:            postgresql://sentinel:${POSTGRES_PASSWORD:-sentinel_dev}@postgres:5432/sentinel
      REDIS_URL:               redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET_KEY:          ${JWT_SECRET_KEY:-change_me}
      ALLOWED_ORIGINS:         '["https://sentinel.local"]'
    networks: [sentinel-net]