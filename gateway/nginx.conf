worker_processes auto;
events { worker_connections 1024; }

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=120r/m;

    # Strict limit only on mutating requests (approve, investigate, execute).
    # GET reads go through the api zone so the dashboard can poll freely.
    map $request_method $approve_key {
        POST    $binary_remote_addr;
        PUT     $binary_remote_addr;
        PATCH   $binary_remote_addr;
        DELETE  $binary_remote_addr;
        default "";
    }
    limit_req_zone $approve_key zone=approve:10m rate=10r/m;

    upstream dashboard_backend { server dashboard-backend:8000; keepalive 32; }

    # ── HTTP ─────────────────────────────────────────────────────────────────
    server {
        listen 80 default_server;
        # Accept requests from any hostname (localhost, IP, sentinel.local, etc.)
        server_name _;

        add_header X-Frame-Options        "DENY"                         always;
        add_header X-Content-Type-Options "nosniff"                      always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:;"
            always;
        add_header Referrer-Policy "strict-origin-when-cross-origin"     always;

        # ── API: auth (tighter rate limit) ───────────────────────────────────
        # Note: no trailing slash in location — avoids nginx's automatic 301
        # redirect for URIs that arrive without a trailing slash.
        location /api/auth {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass       http://dashboard_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API: alerts + plans — reads are unrestricted, writes are throttled ──
        location /api/alerts {
            limit_req zone=approve burst=5 nodelay;
            limit_req zone=api     burst=60 nodelay;
            proxy_pass       http://dashboard_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/plans {
            limit_req zone=approve burst=5 nodelay;
            limit_req zone=api     burst=60 nodelay;
            proxy_pass       http://dashboard_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API: everything else ─────────────────────────────────────────────
        location /api {
            limit_req zone=api burst=60 nodelay;
            proxy_pass       http://dashboard_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── WebSocket ────────────────────────────────────────────────────────
        location /ws {
            proxy_pass             http://dashboard_backend;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_read_timeout     3600s;
        }

        # ── SPA fallback ─────────────────────────────────────────────────────
        # Hashed assets (JS/CSS) — safe to cache long-term; filename changes on rebuild
        location ~* \.(?:js|css)$ {
            root      /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            root      /usr/share/nginx/html;
            # index.html must never be cached — it references hashed assets
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate     /etc/nginx/certs/sentinel.crt;
        ssl_certificate_key /etc/nginx/certs/sentinel.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "DENY"                                always;
        add_header X-Content-Type-Options    "nosniff"                             always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' wss:;"
            always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;

        location /api/auth {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass       http://dashboard_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/alerts {
            limit_req zone=approve burst=5 nodelay;
            limit_req zone=api     burst=60 nodelay;
            proxy_pass       http://dashboard_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/plans {
            limit_req zone=approve burst=5 nodelay;
            limit_req zone=api     burst=60 nodelay;
            proxy_pass       http://dashboard_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api {
            limit_req zone=api burst=60 nodelay;
            proxy_pass       http://dashboard_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass             http://dashboard_backend;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host       $host;
            proxy_read_timeout     3600s;
        }

        location ~* \.(?:js|css)$ {
            root      /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location / {
            root      /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}
