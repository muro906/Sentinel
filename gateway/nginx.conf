worker_processes auto;
events { worker_connections 1024; }

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;
    limit_req_zone $binary_remote_addr zone=approve:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/m;

    upstream dashboard_backend { server dashboard-backend:8000; keepalive 32; }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name sentinel.local;

        ssl_certificate     /etc/nginx/certs/sentinel.crt;
        ssl_certificate_key /etc/nginx/certs/sentinel.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss:;" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        location /api/auth/ {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://dashboard_backend;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/alerts/ {
            limit_req zone=approve burst=5 nodelay;
            proxy_pass http://dashboard_backend;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://dashboard_backend;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /ws/ {
            proxy_pass         http://dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 3600s;
        }
        location / {
            root      /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}